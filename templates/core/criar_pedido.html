{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4 p-3">
            <div class="card-body">
                <h2 class="mb-4 fw-bold text-dark">
                    🍱 Adicionar ao Carrinho
                </h2>

                <h5 class="fw-bold text-secondary">
                    {{ marmita.nome }}
                </h5>

                <p class="text-muted small">
                    {{ marmita.descricao }}
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">
                            Tamanho
                        </label>
                        {{ form.tamanho }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">
                            Quantidade
                        </label>
                        {{ form.quantidade }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-medium text-secondary">
                            Observação
                        </label>
                        {{ form.observacao }}
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold rounded-3 py-2 mt-3">
                        <i class="bi bi-cart-plus me-2"></i>Adicionar ao Carrinho
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
