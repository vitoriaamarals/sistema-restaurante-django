<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Sabor no Ponto</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
        }
        /* Força a estilização nos parágrafos gerados pelo form do Django */
        form p {
            margin-bottom: 1rem;
        }
        form p label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
        }
        form p input {
            display: block;
            width: 100%;
            padding: 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: #212529;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
        }
        form p input:focus {
            color: #212529;
            background-color: #fff;
            border-color: #ffc107;
            outline: 0;
            box-shadow: 0 0 0 0.25s rgba(255,193,7,0.25);
        }
        .errorlist {
            list-style: none;
            padding-left: 0;
            color: #dc3545;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-3 bg-white">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark mb-1">🍱 Sabor no Ponto</h2>
                        <p class="text-muted small">Faça login para gerenciar seus pedidos</p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger p-2 small text-center" role="alert">
                            Usuário ou senha incorretos.
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        {{ form }}
                        <button class="btn btn-warning btn-lg w-100 fw-bold mt-3 shadow-sm" type="submit">
                            Entrar na Conta
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top border-light">
                        <p class="text-muted small mb-0">Não tem acesso? <a href="{% url 'cadastro' %}" class="text-warning fw-semibold text-decoration-none">Cadastre-se</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
