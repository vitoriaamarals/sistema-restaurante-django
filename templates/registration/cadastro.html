<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        🍱 Criar Conta
                    </h2>

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Usuário
                            </label>
                            {{ form.username }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Senha
                            </label>
                            {{ form.password1 }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Confirmar Senha
                            </label>
                            {{ form.password2 }}
                        </div>

                        {% if form.errors %}
                            <div class="alert alert-danger">

                                {% for field in form %}
                                    {% for error in field.errors %}
                                        <div>{{ error }}</div>
                                    {% endfor %}
                                {% endfor %}

                            </div>
                        {% endif %}

                        <button type="submit"
                                class="btn btn-success w-100">
                            Criar Conta
                        </button>

                    </form>

                    <div class="text-center mt-3">
                        <a href="{% url 'login' %}">
                            Já possui conta?
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
