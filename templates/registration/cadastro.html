<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sabor no Ponto</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 0.25rem rgba(255,193,7,.25);
        }

        .errorlist {
            list-style: none;
            padding-left: 0;
            color: #dc3545;
            font-size: .85rem;
            margin-top: .25rem;
            margin-bottom: 0;
        }

        label {
            font-size: .875rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: .5rem;
        }

        input {
            width: 100%;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100 py-5">

<div class="container">
    <div class="row justify-content-center">

        <div class="col-md-5 col-lg-4">

            <div class="card border-0 shadow-lg rounded-4 p-3 bg-white">

                <div class="card-body">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark mb-1">
                            🍱 Sabor no Ponto
                        </h2>
                        <p class="text-muted small">
                            Crie sua conta para acessar o sistema
                        </p>
                    </div>

                    {% if form.errors %}
                        <div class="alert alert-danger p-2 small">
                            {% for field in form %}
                                {% for error in field.errors %}
                                    <div>{{ error }}</div>
                                {% endfor %}
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}">
                                Usuário
                            </label>
                            {{ form.username }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.password1.id_for_label }}">
                                Senha
                            </label>
                            {{ form.password1 }}
                        </div>

                        <div class="mb-3">
                            <label for="{{ form.password2.id_for_label }}">
                                Confirmar Senha
                            </label>
                            {{ form.password2 }}
                        </div>

                        <button
                            type="submit"
                            class="btn btn-warning btn-lg w-100 fw-bold mt-3 shadow-sm">
                            Criar Conta
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-2 border-top border-light">
                        <p class="text-muted small mb-0">
                            Já possui uma conta?
                            <a href="{% url 'login' %}"
                               class="text-warning fw-semibold text-decoration-none">
                                Fazer login
                            </a>
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

</body>
</html>
